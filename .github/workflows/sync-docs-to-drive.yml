name: Sync docs to Drive

# Mirrors the bus-factor documentation set into Google Drive as native Google Docs,
# so the docs a successor needs are readable without cloning the repo.
#
# The repo is the source of truth. The mirror is one way, and anything edited in
# Drive is overwritten on the next push to staging.

on:
  push:
    branches: [staging]
    paths:
      - "README.md"
      - "CLAUDE.md"
      - "docs/**.md"
      - ".claude/commands/handoff.md"
      - "scripts/sync_docs_to_drive.py"
      - ".github/workflows/sync-docs-to-drive.yml"
  # Lets you force a resync from the Actions tab without touching a doc, which is how
  # you seed the Drive folder the very first time.
  workflow_dispatch:

# Two pushes in quick succession must not race: both would see an empty folder and
# each would create its own copy of every Doc. Queue them instead. Never cancel a run
# in flight, a half-applied sync is worse than a slightly delayed one.
concurrency:
  group: sync-docs-to-drive
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Secrets are not exposed to pull requests from forks, and this only ever runs on a
    # direct push to staging, so the token cannot leak via a drive-by PR.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google client libraries
        run: pip install --quiet google-api-python-client google-auth

      - name: Push docs to Drive
        env:
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          DRIVE_DOCS_FOLDER_NAME: ${{ vars.DRIVE_DOCS_FOLDER_NAME }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/sync_docs_to_drive.py
