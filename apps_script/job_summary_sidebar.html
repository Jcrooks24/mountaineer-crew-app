<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: 'Roboto', Arial, sans-serif;
        font-size: 13px;
        margin: 0;
        padding: 12px;
        color: #1f2937;
      }
      h2 { margin: 0 0 8px; font-size: 14px; }
      h3 {
        margin: 14px 0 4px;
        font-size: 13px;
        color: #374151;
        border-bottom: 1px solid #e5e7eb;
        padding-bottom: 2px;
      }
      label { display: block; font-size: 11px; color: #6b7280; margin-top: 6px; }
      input[type="date"], input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        font-size: 13px;
      }
      button {
        background: #2563eb; color: white; border: 0; border-radius: 4px;
        padding: 6px 12px; cursor: pointer; font-size: 12px;
      }
      button.secondary {
        background: #f3f4f6; color: #374151; border: 1px solid #d1d5db;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      .small { font-size: 11px; color: #6b7280; }
      .err { color: #b91c1c; font-size: 12px; margin-top: 6px; }
      .candidate {
        display: block; width: 100%; text-align: left;
        border: 1px solid #e5e7eb; background: white;
        padding: 10px 12px; border-radius: 6px; margin-bottom: 8px; cursor: pointer;
      }
      .candidate:hover { background: #f9fafb; border-color: #93c5fd; }
      .candidate .name {
        font-size: 16px; font-weight: 700; color: #111827; line-height: 1.2;
        word-break: break-word;
      }
      .candidate .meta {
        font-size: 11px; color: #6b7280; margin-top: 4px;
      }
      .uuid { font-family: monospace; font-size: 10px; color: #9ca3af; word-break: break-all; }
      pre {
        white-space: pre-wrap;
        font-family: 'SF Mono', Consolas, monospace;
        font-size: 11px;
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        padding: 8px;
        border-radius: 4px;
        max-height: 600px;
        overflow: auto;
      }
      .copy-btn { margin: 6px 0; }
      .back-btn { margin-bottom: 8px; }
    </style>
  </head>
  <body>
    <div id="search-panel">
      <h2>Job Summary</h2>
      <label for="date">Job date (optional)</label>
      <input type="date" id="date">
      <label for="name">Job name (partial, optional)</label>
      <input type="text" id="name" placeholder="e.g. Smith move">
      <div style="margin-top: 10px;">
        <button id="btnSearch">Search</button>
      </div>
      <div id="searchErr" class="err"></div>
    </div>

    <div id="results"></div>
    <div id="summary"></div>

    <script>
      function $(id) { return document.getElementById(id); }

      function setBusy(busy) { $('btnSearch').disabled = busy; }

      function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, ch =>
          ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[ch])
        );
      }

      function pad(s, n) {
        s = String(s);
        while (s.length < n) s += ' ';
        return s;
      }

      function onSearch() {
        const date = $('date').value;
        const name = $('name').value;
        const err = $('searchErr');
        err.textContent = '';
        if (!date && !name.trim()) {
          err.textContent = 'Enter a date, a name, or both.';
          return;
        }
        setBusy(true);
        $('results').innerHTML = '<div class="small">Searching…</div>';
        $('summary').innerHTML = '';
        google.script.run
          .withSuccessHandler(renderResults)
          .withFailureHandler(e => {
            err.textContent = (e && e.message) || 'Search failed.';
            $('results').innerHTML = '';
            setBusy(false);
          })
          .searchJobs(date, name);
      }

      function renderResults(matches) {
        setBusy(false);
        const div = $('results');
        if (!matches || !matches.length) {
          div.innerHTML = '<h3>Matches (0)</h3><div class="small">No jobs found.</div>';
          return;
        }
        let html = '<h3>Matches (' + matches.length + ')</h3>';
        for (const m of matches) {
          const range = m.dates.length === 0 ? 'no dates'
            : (m.dates.length === 1 ? m.dates[0]
                : m.dates[0] + ' → ' + m.dates[m.dates.length - 1]);
          html += '<button class="candidate" data-uuid="' + escapeHtml(m.job_uuid) + '">'
                +   '<div class="name">' + escapeHtml(m.job_name || '(unnamed job)') + '</div>'
                +   '<div class="meta">' + escapeHtml(range)
                +     ' · ' + m.event_count + ' event' + (m.event_count === 1 ? '' : 's')
                +     ' · ' + m.material_count + ' material' + (m.material_count === 1 ? '' : 's')
                +   '</div>'
                + '</button>';
        }
        div.innerHTML = html;
        Array.from(div.querySelectorAll('.candidate')).forEach(b => {
          b.addEventListener('click', () => loadSummary(b.dataset.uuid));
        });
      }

      function loadSummary(uuid) {
        const sum = $('summary');
        sum.innerHTML = '<div class="small">Loading…</div>';
        google.script.run
          .withSuccessHandler(renderSummary)
          .withFailureHandler(e => {
            sum.innerHTML = '<div class="err">' + escapeHtml((e && e.message) || 'Load failed.') + '</div>';
          })
          .getJobSummary(uuid);
      }

      function renderSummary(s) {
        const text = formatSummaryText(s);
        $('summary').innerHTML =
            '<button class="secondary back-btn" id="backBtn">← Back to matches</button>'
          + '<h3>' + escapeHtml(s.job_name || 'Unnamed job') + '</h3>'
          + '<div class="uuid">' + escapeHtml(s.job_uuid) + '</div>'
          + '<button class="copy-btn secondary" id="copyBtn">Copy summary</button>'
          + '<pre>' + escapeHtml(text) + '</pre>';
        $('backBtn').addEventListener('click', () => { $('summary').innerHTML = ''; });
        $('copyBtn').addEventListener('click', () => {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); } catch (_) {}
          document.body.removeChild(ta);
          const b = $('copyBtn');
          const orig = b.textContent;
          b.textContent = 'Copied ✓';
          setTimeout(() => { b.textContent = orig; }, 1500);
        });
      }

      // Treat null/undefined/empty-string/whitespace as "no response". Numbers
      // including 0 are valid responses and pass through. Yes/No strings from
      // the sheet pass through verbatim.
      const NO_RESP = 'no response';
      function fmt(v) {
        if (v === null || v === undefined) return NO_RESP;
        if (typeof v === 'number') return String(v);
        const s = String(v);
        return s.trim() === '' ? NO_RESP : s;
      }
      function fmtPct(v) {
        const r = fmt(v);
        return r === NO_RESP ? NO_RESP : r + '%';
      }
      function fmtMoney(v) {
        if (v === null || v === undefined || v === '' ) return NO_RESP;
        const n = Number(v);
        return isNaN(n) ? NO_RESP : '$' + n.toFixed(2);
      }

      function formatSummaryText(s) {
        const lines = [];
        lines.push(s.job_name || '(unnamed job)');
        if (s.job_dates && s.job_dates.length) {
          lines.push(s.job_dates.length === 1
            ? s.job_dates[0]
            : s.job_dates[0] + ' → ' + s.job_dates[s.job_dates.length - 1]);
        } else {
          lines.push(NO_RESP);
        }
        lines.push('');

        // TIMESTAMPS
        lines.push('TIMESTAMPS:');
        if (s.timestamps && s.timestamps.length) {
          for (const e of s.timestamps) {
            lines.push('  ' + pad(e.type, 12) + ' ' + (e.time || NO_RESP)
              + '   note: ' + fmt(e.note));
          }
        } else {
          lines.push('  ' + NO_RESP);
        }
        lines.push('');

        // MATERIALS
        lines.push('MATERIALS:');
        if (s.materials_aggregated && s.materials_aggregated.length) {
          for (const m of s.materials_aggregated) {
            lines.push('  ' + m.qty + ' × ' + m.name);
          }
          lines.push('  Materials total: '
            + (s.materials_total > 0 ? '$' + s.materials_total.toFixed(2) : NO_RESP));
        } else {
          lines.push('  ' + NO_RESP);
        }
        lines.push('');

        // JOB REPORT — every field listed, blanks marked as "no response".
        lines.push('JOB REPORT:');
        if (s.job_report) {
          const j = s.job_report;
          lines.push('  Submitted by:          ' + fmt(j.submitted_by));
          lines.push('  Billing method:        ' + fmt(j.billing_method));
          lines.push('  Personal vehicles:     ' + fmt(j.personal_vehicles));
          lines.push('  Dumpster:              ' + fmtPct(j.dumpster_pct));
          lines.push('  Recycling:             ' + fmtPct(j.recycling_pct));
          lines.push('  Review candidate:      ' + fmt(j.review_candidate));
          lines.push('  Hours match:           ' + fmt(j.hours_match));
          lines.push('  Hours mismatch reason: ' + fmt(j.hours_mismatch_reason));
          lines.push('  Last updated:          ' + fmt(j.updated_at));
          lines.push('  EMPLOYEE HOURS:');
          const ehText = String(j.employee_hours || '').trim();
          if (ehText) {
            for (const eh of ehText.split('\n')) {
              if (eh) lines.push('    ' + eh);
            }
          } else {
            lines.push('    ' + NO_RESP);
          }
        } else {
          lines.push('  ' + NO_RESP);
        }
        lines.push('');

        // BILL — every field listed, blanks marked as "no response".
        lines.push('BILL:');
        if (s.bill) {
          lines.push('  Items:');
          if (s.bill.items && s.bill.items.length) {
            for (const i of s.bill.items) {
              lines.push('    Label:    ' + fmt(i.label));
              lines.push('    Qty:      ' + fmt(i.qty));
              lines.push('    Unit:     ' + fmt(i.unit));
              lines.push('    Rate:     ' + fmtMoney(i.rate));
              lines.push('    Discount: ' + fmtPct(i.discount));
              lines.push('    Amount:   ' + fmtMoney(i.amount));
              lines.push('    Source:   ' + fmt(i.source));
              lines.push('    ──');
            }
          } else {
            lines.push('    ' + NO_RESP);
          }
          lines.push('  Global discount: ' + fmtPct(s.bill.global_discount_pct));
          lines.push('  Notes:           ' + fmt(s.bill.notes));
          lines.push('  Bill total:      ' + fmtMoney(s.bill.total));
        } else {
          lines.push('  ' + NO_RESP);
        }
        lines.push('');

        // DVIRS — matched by inspection date, every field per row.
        lines.push('DVIRS (matched by inspection date):');
        if (s.dvirs && s.dvirs.length) {
          for (const d of s.dvirs) {
            lines.push('  Inspection date: ' + fmt(d.inspection_date));
            lines.push('  Inspection type: ' + fmt(d.inspection_type));
            lines.push('  Phase:           ' + fmt(d.phase));
            lines.push('  Vehicle:         ' + fmt(d.vehicle_number));
            lines.push('  Trailer:         ' + fmt(d.trailer_number));
            lines.push('  Driver:          ' + fmt(d.driver_name));
            lines.push('  Condition:       ' + fmt(d.condition));
            lines.push('  Defects:         ' + fmt(d.defects));
            lines.push('  Defect notes:    ' + fmt(d.defect_notes));
            lines.push('  Mechanic:        ' + fmt(d.mechanic_name));
            lines.push('  Created at:      ' + fmt(d.created_at));
            lines.push('  ──');
          }
        } else {
          lines.push('  ' + NO_RESP);
        }
        lines.push('');

        // ESTIMATES — matched by job-name substring, every field per row.
        lines.push('ESTIMATES (matched by job name):');
        if (s.estimates && s.estimates.length) {
          for (const e of s.estimates) {
            lines.push('  Customer name:   ' + fmt(e.customer_name));
            lines.push('  Move date:       ' + fmt(e.move_date));
            lines.push('  Origin:          ' + fmt(e.origin_address));
            lines.push('  Destination:     ' + fmt(e.destination_address));
            lines.push('  Estimated weight: '
              + (e.estimated_weight_lbs ? Math.round(e.estimated_weight_lbs) + ' lbs' : NO_RESP));
            lines.push('  Estimated volume: '
              + (e.estimated_cubic_ft ? e.estimated_cubic_ft.toFixed(1) + ' cu ft' : NO_RESP));
            lines.push('  Items:');
            if (e.items && e.items.length) {
              for (const it of e.items) {
                lines.push('    ' + it.qty + ' × ' + it.item_name
                  + (it.room ? ' (' + it.room + ')' : ''));
              }
            } else {
              lines.push('    ' + NO_RESP);
            }
            lines.push('  ──');
          }
        } else {
          lines.push('  ' + NO_RESP);
        }

        return lines.join('\n').replace(/\n+$/, '');
      }

      $('btnSearch').addEventListener('click', onSearch);
      $('name').addEventListener('keydown', e => { if (e.key === 'Enter') onSearch(); });
    </script>
  </body>
</html>
